name: Shield + paper bot

"on":
  # Paper trading is halted. No schedule; a manual run still cannot open positions
  # while quantteam/HALTED exists.
  workflow_dispatch:

# Share the push lock with the fresh scan. Do not cancel a paper cycle that
# is already running; the waiting run starts after that cycle pushes.
concurrency:
  group: main-writers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper bot and Shield
        working-directory: quantteam
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python gha_cycle.py

      - name: Commit paper state
        run: |
          # Missing halt/trade files are skipped. A rejected push rebases onto
          # main and retries, so a scan commit that landed mid-cycle is kept.
          bash .github/scripts/push-main.sh "chore: paper bot + shield cycle [skip ci]" \
            quantteam/state.json \
            quantteam/config/halt.json \
            quantteam/config/active_setup.json \
            quantteam/trades.csv \
            quantteam/trades_shadow.csv \
            quantteam/data/paper_daily.json \
            quantteam/out/shield_status.json \
            quantteam/out/shield_events.jsonl \
            quantteam/logs/decisions.jsonl
